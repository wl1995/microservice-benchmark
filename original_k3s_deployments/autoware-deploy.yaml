--- 
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoware-rviz-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autoware-rviz
  template:
    metadata:
      labels: 
        app: autoware-rviz
    spec:
      containers:
        - name: autoware-rviz
          image: autoware-rviz-time
          command: ["/bin/sh","-c"]
          args: ["/run_rviz.sh>/log/log_rviz.txt"]
          imagePullPolicy: IfNotPresent
          ports:
          - containerPort: 5900
          volumeMounts:
            - name: my-volume
              mountPath: /log
      volumes:
        - name: my-volume
          hostPath:
            path: /home/tumi6/autoware_log

--- 
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoware-rosbag-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autoware-rosbag
  template:
    metadata:
      labels: 
        app: autoware-rosbag
    spec:
      containers:
        - name: autoware-rosbag
          image: autoware-rosbag
          command: ["/run_rosbag.sh"]
          imagePullPolicy: IfNotPresent

---
apiVersion: v1
kind: Service
metadata:
  name: port-service
spec:
  type: NodePort
  selector:
    app: autoware-rviz
  ports:
  - protocol: TCP
    nodePort: 31004
    targetPort: 5900
    port: 80
