---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoware-vehicle-deployment
  namespace: default
spec:
  replicas: 1 
  selector:
    matchLabels:
      app: autoware-vehicle
  template:
    metadata:
      labels:
        app: autoware-vehicle
    spec:
      containers:
        - name: autoware-vehicle
          image: autoware-vehicle-time
          command: ["/bin/sh","-c"]
          args: ["/autoware/run_vehicle.sh>/log/log_vehicle.txt"]
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: my-volume
              mountPath: /log
      volumes:
        - name: my-volume
          hostPath:
            path: /home/tumi6/autoware_log 

