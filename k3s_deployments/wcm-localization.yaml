---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoware-vehicle-deployment
  namespace: default
spec:
  replicas: 1 
  selector:
    matchLabels:
      app: autoware-vehicle
  template:
    metadata:
      labels:
        app: autoware-vehicle
    spec:
      containers:
        - name: autoware-vehicle
          image: autoware-whole-time
          command: ["/bin/sh","-c"]
          args: ["/autoware/install/autoware_launch/share/autoware_launch/launch/docker_launch/run_vehicle.sh>/k3s_localization_log/log_vehicle.txt"]
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: launch
              mountPath: /autoware/install/autoware_launch/share/autoware_launch/launch
            - name: log
              mountPath: /k3s_localization_log
      volumes:
        - name: launch
          hostPath:
            path: /home/tumi6/workspace/autoware-microservice-bench/launch
        - name: log
          hostPath:
            path: /home/tumi6/workspace/autoware-microservice-bench/autoware_log/k3s_localization_log

