--- 
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoware-rviz-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autoware-rviz
  template:
    metadata:
      labels: 
        app: autoware-rviz
    spec:
      containers:
        - name: autoware-rviz
          image: autoware-whole-time
          command: ["/bin/sh","-c"]
          args: ["/autoware/install/autoware_launch/share/autoware_launch/launch/docker_launch/run_rviz.sh>/k3s_log/log_rviz.txt"]
          imagePullPolicy: IfNotPresent
          ports:
          - containerPort: 5900
          volumeMounts:
            - name: launch
              mountPath: /autoware/install/autoware_launch/share/autoware_launch/launch
            - name: log
              mountPath: /k3s_log
      volumes:
        - name: launch
          hostPath:
            path: /home/tumi6/workspace/autoware-microservice-bench/launch
        - name: log
          hostPath:
            path: /home/tumi6/workspace/autoware-microservice-bench/autoware_log/k3s_log

--- 
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoware-rosbag-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autoware-rosbag
  template:
    metadata:
      labels: 
        app: autoware-rosbag
    spec:
      containers:
        - name: autoware-rosbag
          image: autoware-rosbag
          command: ["/run_rosbag.sh"]
          imagePullPolicy: IfNotPresent

---
apiVersion: v1
kind: Service
metadata:
  name: port-service
spec:
  type: NodePort
  selector:
    app: autoware-rviz
  ports:
  - protocol: TCP
    nodePort: 31004
    targetPort: 5900
    port: 80
