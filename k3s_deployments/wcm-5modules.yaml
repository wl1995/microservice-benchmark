---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoware-map-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autoware-map
  template:
    metadata:
      labels:
        app: autoware-map
    spec:
      containers:
        - name: autoware-map
          image: autoware-whole-time
          command: ["/bin/sh","-c"] 
          args: ["/autoware/install/autoware_launch/share/autoware_launch/launch/docker_launch/run_map_vehicle.sh>/k3s_log/log_map.txt"]
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: launch
              mountPath: /autoware/install/autoware_launch/share/autoware_launch/launch
            - name: log
              mountPath: /k3s_log
      volumes:
        - name: launch
          hostPath:
            path: /home/tumi6/workspace/autoware-microservice-bench/launch
        - name: log
          hostPath:
            path: /home/tumi6/workspace/autoware-microservice-bench/autoware_log/k3s_log

